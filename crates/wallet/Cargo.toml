[package]
name = "requant-wallet"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
description = "Requant wallet: a 24-word backup phrase and many addresses, offline signing, payments through a node."

[dependencies]
requant-consensus = { path = "../consensus" }
requant-node = { path = "../node" }
ed25519-dalek = "=2.2.0"
getrandom = "=0.2.15"
argon2 = "=0.5.3"
chacha20poly1305 = "=0.10.1"
rpassword = "=7.3.1"
serde_json = "=1.0.140"
sha2 = "=0.10.9"
zeroize = "=1.9.1"

[[bin]]
name = "requant-wallet"
path = "src/main.rs"
